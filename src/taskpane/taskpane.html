<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Niveau de confidentialité</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <script src="taskpane.js?v=6" defer></script>
  <style>
    :root {
      --ink: #1f2328;
      --muted: #6b7280;
      --line: #e5e7eb;
      --focus: #2563eb;
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--ink);
      background: #ffffff;
      padding: 16px;
      font-size: 14px;
    }
    h1 {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .hint { color: var(--muted); font-size: 12.5px; margin-bottom: 16px; }
    .levels { display: flex; flex-direction: column; gap: 8px; }
    .level {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      text-align: left;
      font: inherit;
      transition: border-color .12s, background .12s;
    }
    .level:hover { background: #f8fafc; }
    .level:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
    .level.selected { border-color: var(--ink); background: #f3f4f6; }
    .dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .c1 .dot { background: #dc2626; }
    .c2 .dot { background: #ea580c; }
    .c3 .dot { background: #2563eb; }
    .c4 .dot { background: #16a34a; }
    .level b { display: block; font-weight: 600; font-size: 13.5px; }
    .level span { color: var(--muted); font-size: 12px; }
    #status {
      margin-top: 16px;
      font-size: 12.5px;
      color: var(--muted);
      min-height: 18px;
    }
    #status.ok { color: #15803d; }
    #status.err { color: #b91c1c; }
    @media (prefers-reduced-motion: reduce) {
      .level { transition: none; }
    }
  </style>
</head>
<body>
  <h1>Niveau de confidentialité</h1>
  <p class="hint">Sélectionnez un niveau. L'envoi est bloqué tant qu'aucun niveau n'est choisi.</p>

  <div class="levels" role="radiogroup" aria-label="Niveau de confidentialité">
    <button class="level c1" data-level="C1" role="radio" aria-checked="false">
      <span class="dot" aria-hidden="true"></span>
      <span><b>C1 — Strictement confidentiel</b><span>Diffusion nominative uniquement, ne pas transférer</span></span>
    </button>
    <button class="level c2" data-level="C2" role="radio" aria-checked="false">
      <span class="dot" aria-hidden="true"></span>
      <span><b>C2 — Confidentiel</b><span>Réservé aux destinataires et à leur hiérarchie</span></span>
    </button>
    <button class="level c3" data-level="C3" role="radio" aria-checked="false">
      <span class="dot" aria-hidden="true"></span>
      <span><b>C3 — Interne</b><span>Réservé à l'entreprise, ne pas diffuser à l'extérieur</span></span>
    </button>
    <button class="level c4" data-level="C4" role="radio" aria-checked="false">
      <span class="dot" aria-hidden="true"></span>
      <span><b>C4 — Public</b><span>Diffusable sans restriction</span></span>
    </button>
  </div>

  <p id="status" role="status"></p>
</body>
</html>
